name: Build and Release Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to upload caches to'
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
        default: 'dev'

jobs:
  build-and-release-cache:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: geektrust.azurecr.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Caches inside IDE Container
        run: |
          mkdir -p /tmp/.gradle-cache-output
          
          cat << 'EOF' > build-cache-script.sh
          #!/bin/bash
          set -e
          
          echo "==> Cleaning git metadata..."
          rm -rf .git
          
          echo "==> Compiling Debug Sources..."
          ./gradlew compileDebugSources \
              --no-watch-fs \
              --warning-mode none \
              --no-daemon \
              --build-cache \
              --parallel \
              --configuration-cache
          
          echo "==> Exporting Gradle Caches..."
          cp -r /root/.gradle/caches /root/.gradle/daemon /root/.gradle/wrapper /tmp/gradle-cache-output/ || true
          EOF
          chmod +x build-cache-script.sh

          docker run --rm --entrypoint "" \
            -v ${{ github.workspace }}:/home/user/workspace/project \
            -v /tmp/.gradle-cache-output:/tmp/gradle-cache-output \
            -w /home/user/workspace/project \
            geektrust.azurecr.io/macondo/gt-editor-vscode-android:latest \
            ./build-cache-script.sh
      - name: Compress Build Cache
        run: |
          cd /tmp/.gradle-cache-output
          sudo tar -czf /tmp/gradle-cache.tar.gz caches daemon wrapper
          
          cd ${{ github.workspace }}
          sudo tar -czf /tmp/project-gradle.tar.gz -C .gradle .
          
          sudo mkdir -p to_upload
          sudo mv /tmp/gradle-cache.tar.gz /tmp/project-gradle.tar.gz to_upload/

      - name: Clean Existing Cache
        env:
          STARTER_KIT_NAME: ${{ github.event.repository.name }}
        run: |
          sudo mkdir -p /mnt/gradle-cache
          sudo mount -t cifs //${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}.file.core.windows.net/gradle-cache /mnt/gradle-cache -o vers=3.0,username=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }},password=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }},dir_mode=0777,file_mode=0777,serverino
          
          sudo rm -rf /mnt/gradle-cache/android/${STARTER_KIT_NAME}/* || true
          sudo mkdir -p /mnt/gradle-cache/android/${STARTER_KIT_NAME}
          
          sudo umount /mnt/gradle-cache

      - name: Upload to Azure File Share
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          STARTER_KIT_NAME: ${{ github.event.repository.name }}
        run: |
          az storage file upload-batch \
            --destination gradle-cache \
            --destination-path android/${STARTER_KIT_NAME} \
            --source to_upload \
            --max-connections 32
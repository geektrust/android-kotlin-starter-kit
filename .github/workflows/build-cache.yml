name: Build and Release Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Exact Absolute Path
        # Gradle's UP-TO-DATE checks are highly sensitive to absolute paths.
        # By compiling the code in the exact same directory path as the IDE container, 
        # we guarantee a 100% cache hit!
        run: |
          sudo mkdir -p /home/user/workspace/project
          sudo chown -R $USER /home/user/workspace/project
          cp -a . /home/user/workspace/project/

      - name: Compile and Hydrate Cache
        # We run the standard assemble tasks to cache all KSP generated code and dependencies
        # CRITICAL: We must also match the exact GRADLE_USER_HOME path used in the container (/root/.gradle)
        # otherwise task inputs containing dependency paths will differ and KSP will re-execute!
        run: |
          sudo mkdir -p /root/.gradle
          sudo chown -R $USER /root/.gradle
          export GRADLE_USER_HOME=/root/.gradle
          cd /home/user/workspace/project
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --build-cache

      - name: Compress Build Cache
        # We zip the cache from the exact absolute path
        run: |
          cd /home/user/workspace/project
          zip -r $GITHUB_WORKSPACE/build-cache.zip .gradle/ app/build/

      - name: Update 'latest' Git Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build Cache
          files: build-cache.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}